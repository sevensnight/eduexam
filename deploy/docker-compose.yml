name: eduexam

services:
  database:
    image: mysql:8.0
    container_name: eduexam-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=80
      - --performance-schema=OFF
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: eduexam
      MYSQL_USER: eduexam
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 35s
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ./backend
    image: eduexam-backend:local
    container_name: eduexam-backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: eduexam
      DB_USERNAME: eduexam
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # MySQL 8 defaults to caching_sha2_password. The backend needs the
      # server public key for the first password exchange on this isolated
      # Docker network because database TLS is disabled here.
      DB_ALLOW_PUBLIC_KEY_RETRIEVAL: "true"
      DB_USE_SSL: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Djava.security.egd=file:/dev/urandom
      TZ: Asia/Shanghai
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 35s
    mem_limit: 448m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: public.ecr.aws/docker/library/nginx:1.27-alpine
    container_name: eduexam-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 80:80
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  data:
    name: eduexam-data
    internal: true
  edge:
    name: eduexam-edge

volumes:
  mysql_data:
    name: eduexam-mysql-data
